[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-discovery"
version = "0.1.0"
description = "AI/ML tools for exoplanet discovery and light-curve anomaly detection."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=6.1,<8",
    "lightkurve>=2.5,<3",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "fastapi>=0.104,<1",
    "uvicorn>=0.24,<1",
    "python-multipart>=0.0.6,<1",
    "gradio>=5.50,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = "^app\\.py$"
